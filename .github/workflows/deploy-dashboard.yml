name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_FUNCTION_KEY: ${{ secrets.PUBLIC_FUNCTION_KEY }}
        run: npm run build

      # The route rule is the ONLY thing keeping this site private, and the
      # function key is compiled into the bundle — so a missing config file does
      # not degrade gracefully, it publishes the app and the key with it. Astro
      # only copies public/ into dist/, so this is one `git mv` away from
      # silently breaking. Fail loudly instead. (Ported from my-expenses, where
      # exactly this failure already happened once.)
      - name: Verify the auth config shipped
        working-directory: dashboard
        run: |
          test -f dist/staticwebapp.config.json \
            || { echo "::error::dist/staticwebapp.config.json missing — the site would deploy PUBLIC"; exit 1; }
          grep -q '"allowedRoles"' dist/staticwebapp.config.json \
            || { echo "::error::config has no allowedRoles — the site would deploy PUBLIC"; exit 1; }
          echo "auth config present:"; cat dist/staticwebapp.config.json

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # We build ourselves (npm ci, above) so the deploy uses the exact
          # pinned lockfile/build rather than the Oryx container's own
          # (floating) install + build. With skip_app_build, app_location
          # must point at the prebuilt output itself.
          app_location: dashboard/dist
          output_location: ''
          skip_app_build: true
