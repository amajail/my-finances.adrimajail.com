name: Deploy Azure Function

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-azure-function.yml'
  workflow_dispatch:

env:
  # Substitute these after provisioning. Or move to repo variables / secrets.
  AZURE_FUNCTIONAPP_NAME: my-finances-func
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '22.x'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run tests (with full deps)
        run: |
          npm ci
          npm test

      - name: Reduce node_modules to production-only for deployment
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
