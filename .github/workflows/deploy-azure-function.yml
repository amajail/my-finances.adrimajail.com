name: Deploy Azure Function

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-azure-function.yml'
  workflow_dispatch:

env:
  # AZURE_FUNCTIONAPP_NAME must be set as a repo variable (Settings →
  # Secrets and variables → Actions → Variables). The job will fail fast
  # if it's not configured.
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
  AZURE_RESOURCE_GROUP: my-finances-rg
  NODE_VERSION: '22.x'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Reduce node_modules to production-only
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Defensively (re)apply runtime + worker indexing flag
        run: |
          az functionapp config set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --linux-fx-version "Node|22"

          # TZ=America/New_York anchors the refreshPricesTimer cron
          # (0 30 16 * * 1-5) to NYSE close + 30 min, DST-aware year-round.
          # See src/functions/refreshPricesTimer.js.
          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              "FUNCTIONS_WORKER_RUNTIME=node" \
              "WEBSITE_NODE_DEFAULT_VERSION=~22" \
              "AzureWebJobsFeatureFlags=EnableWorkerIndexing" \
              "TZ=America/New_York"

      - name: Create deployment zip
        run: |
          zip -rq deploy.zip . \
            --exclude "*.git*" \
            --exclude "dashboard/*" \
            --exclude "tests/*" \
            --exclude "scripts/*" \
            --exclude ".env*" \
            --exclude "local.settings.json" \
            --exclude "logs/*"
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy.zip
